<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Image Banner</title>
<style>
    /* Reset default margins */
    body {
        margin: 0;
        font-family: Arial, sans-serif;
    }

    /* Banner container */
    .banner {
        display: flex; /* Arrange images side-by-side */
        overflow: hidden; /* Hide overflow if images are larger */
        height: 300px; /* Fixed height for banner */
    }

    /* Each image container */
    .banner img {
        width: 100%; /* Make images responsive */
        height: 100%;
        object-fit: cover; /* Crop images to fit without distortion */
    }

    /* Optional: Equal width for each image */
    .banner > div {
        flex: 1;
    }

    /* Optional overlay text */
    .overlay {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: rgb(250, 250, 250);
        font-size: 2rem;
        background: rgba(67, 56, 56, 0.5);
        padding: 10px 20px;
        border-radius: 10px;
    }

    /* Positioning for overlay */
    .banner-wrapper {
        position: relative;
    }
</style>
</head>
<body>

<div class="banner-wrapper">
    <div class="banner transition hover:scale-105">
        <div><img src="Dang.gif" alt="Image 1"></div>
        <div><img src="boh.GIF" alt="Image 2"></div>
        <div><img src="Placeholder.gif" alt="Image 3"></div>
    </div>
    <div class="overlay ">Work in Progress</div>
</div>
</body>
</html>
