<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giant Circle Example</title>
<style>
  /* Style for the giant circle */
  .giant-circle {
    width: 400px;              /* Circle width */
    height: 400px;             /* Circle height (same as width) */
    background-color: #cbdfcc; /* Circle color */
    border-radius: 50%;        /* Makes it a perfect circle */
    margin: 50px auto;         /* Center horizontally */
    box-shadow: 0 0 20px rgba(0,0,0,0.3); /* Optional shadow */
  }

  /* Optional: make it responsive */
  @media (max-width: 500px) {
    .giant-circle {
      width: 80vw;
      height: 80vw;
    }
  }
</style>
</head>
<body>

<div class="giant-circle"></div>

</body>
</html>
